name: generate animation

on:
  # Refresh the contribution calendar and profile cards daily.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "cards/**"
      - "data/contributions.json"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data
          FROM=$(date -u -d '1 year ago' +%Y-%m-%dT%H:%M:%SZ)
          RESPONSE=$(gh api graphql \
            -f query='query($login: String!, $from: DateTime!) { user(login: $login) { contributionsCollection(from: $from) { contributionCalendar { totalContributions weeks { contributionDays { date contributionCount } } } } } }' \
            -f login="$GITHUB_REPOSITORY_OWNER" \
            -f from="$FROM")
          echo "$RESPONSE" | jq -e '.data.user.contributionsCollection.contributionCalendar | select(.weeks != null)' > data/contributions.json || {
            echo "Contribution query failed. Add a PROFILE_TOKEN repository secret with read:user permission; response follows:" >&2
            echo "$RESPONSE" | jq '.errors // .data' >&2
            exit 1
          }

      - name: Install font subsetter
        run: python -m pip install 'fonttools[woff,woff2]'

      - name: Render animated profile cards
        run: python scripts/render_profile_cards.py

      - name: Commit refreshed data and cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh animated profile cards"
            git push
          fi

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3.2.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish contribution snake to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
